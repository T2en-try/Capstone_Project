name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-before-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Run backend tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        pytest --tb=short -v

    - name: Validate docker compose configuration
      run: docker compose config
      working-directory: ${{ github.workspace }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: test-before-deploy
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        script: |
          set -e

          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi

          echo "Starting deployment..."
          
          # Navigate to project directory
          cd ${{ secrets.DEPLOY_PATH || /home/ubuntu/capstone-project }}
          
          # Pull latest code
          echo "Pulling latest code..."
          git pull origin main || exit 1
          
          # Copy environment file
          echo "Setting up environment..."
          cp .env.production .env 2>/dev/null || echo "Using existing .env"
          
          # Stop existing containers
          echo "Stopping existing containers..."
          $COMPOSE_CMD down || true
          
          # Build and start containers
          echo "Building and starting containers..."
          $COMPOSE_CMD up -d --build
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 10
          
          # Check health status
          echo "Checking health..."
          $COMPOSE_CMD ps
          
          # Verify API is responding
          for i in {1..12}; do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "API is responding"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "API health check failed after waiting"
              $COMPOSE_CMD logs --tail=100 backend || true
              exit 1
            fi
            sleep 5
          done
          
          echo "Deployment complete"
    
    - name: Deployment Status
      if: success()
      run: |
        echo "Production deployment successful"
        echo "Server: ${{ secrets.DEPLOY_HOST }}"
        echo "Deployed at: $(date)"
    
    - name: Deployment Failed
      if: failure()
      run: |
        echo "Deployment failed"
        echo "Server: ${{ secrets.DEPLOY_HOST }}"
        exit 1
