name: Deploy to Production

permissions:
  contents: read

on:
  workflow_dispatch:  # Enable manually after server/secrets are ready

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-before-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Run backend tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        pytest --tb=short -v

    - name: Build frontend
      run: |
        npm ci
        npm run build
      working-directory: frontend

    - name: Validate docker compose configuration
      run: docker compose config
      working-directory: ${{ github.workspace }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: test-before-deploy
    if: success()
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        script: |
          set -eu

          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi

          DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/home/ubuntu/capstone-project' }}"

          echo "Starting deployment..."
          echo "Running preflight checks..."

          command -v git >/dev/null 2>&1 || { echo "git is not installed"; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "docker is not installed"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "docker daemon is not available"; exit 1; }
          [ -d "$DEPLOY_DIR" ] || { echo "Deploy path not found: $DEPLOY_DIR"; exit 1; }
          
          # Navigate to project directory
          cd "$DEPLOY_DIR"
          [ -d .git ] || { echo "Deploy path is not a git repository"; exit 1; }
          
          # Update code deterministically
          echo "Fetching latest code..."
          git fetch --prune origin main || exit 1
          git reset --hard origin/main || exit 1
          
          # Set up environment file
          echo "Setting up environment..."
          if [ -f .env.production ]; then
            cp .env.production .env
          elif [ -f .env ]; then
            echo "Using existing .env"
          else
            echo "Neither .env.production nor .env exists"
            exit 1
          fi

          for required_var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL; do
            if ! grep -Eq "^${required_var}=" .env; then
              echo "Missing required env var in .env: ${required_var}"
              exit 1
            fi
          done

          echo "Validating docker compose configuration..."
          $COMPOSE_CMD config >/dev/null
          
          # Stop existing containers
          echo "Stopping existing containers..."
          $COMPOSE_CMD down || true
          
          # Build and start containers
          echo "Building and starting containers..."
          $COMPOSE_CMD up -d --build --remove-orphans
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          
          # Verify API is responding through nginx
          i=1
          while [ "$i" -le 24 ]; do
            if $COMPOSE_CMD exec -T nginx wget -q -O /dev/null http://127.0.0.1/api/health; then
              echo "API is responding through nginx"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "API health check failed after waiting"
              echo "Container status:"
              $COMPOSE_CMD ps || true
              echo "Recent logs:"
              $COMPOSE_CMD logs --tail=100 backend frontend nginx || true
              exit 1
            fi
            sleep 5
            i=$((i + 1))
          done

          # Check final health status
          echo "Checking health..."
          $COMPOSE_CMD ps
          
          echo "Deployment complete"
    
    - name: Deployment Status
      if: success()
      run: |
        echo "Production deployment successful"
        echo "Server: ${{ secrets.DEPLOY_HOST }}"
        echo "Deployed at: $(date)"
    
    - name: Deployment Failed
      if: failure()
      run: |
        echo "Deployment failed"
        echo "Server: ${{ secrets.DEPLOY_HOST }}"
        exit 1
