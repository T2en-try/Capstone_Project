<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- Road background -->
  <rect x="60" y="80" width="280" height="180" rx="4" fill="#2d2d2d"/>
  <!-- Cracked road surface -->
  <line x1="100" y1="150" x2="180" y2="130" stroke="#555" stroke-width="2"/>
  <line x1="180" y1="130" x2="220" y2="170" stroke="#555" stroke-width="2"/>
  <line x1="220" y1="170" x2="300" y2="145" stroke="#555" stroke-width="2"/>
  <line x1="150" y1="200" x2="250" y2="190" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="180" x2="160" y2="220" stroke="#555" stroke-width="1.5"/>
  <line x1="260" y1="160" x2="290" y2="200" stroke="#555" stroke-width="1.5"/>
  <!-- Area indicator -->
  <rect x="90" y="120" width="180" height="120" rx="4" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" opacity="0.8"/>
  <!-- Camera frame hint -->
  <rect x="60" y="80" width="280" height="180" rx="4" fill="none" stroke="#f0c040" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <polyline points="65,85 65,100 80,100" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="335,85 335,100 320,100" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="65,255 65,240 80,240" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="335,255 335,240 320,240" fill="none" stroke="#f0c040" stroke-width="3"/>
  <!-- Label -->
  <rect x="80" y="90" width="100" height="22" rx="4" fill="#f0c040"/>
  <text x="130" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">✓ ตัวอย่างที่ดี</text>
  <!-- Description -->
  <rect x="0" y="265" width="400" height="35" fill="#0d0d1a"/>
  <text x="200" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#aaa">ถ่ายให้เห็นรอยแตกร้าวทั่วบริเวณ</text>
</svg>
