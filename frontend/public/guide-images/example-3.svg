<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#2a1515"/>
  <!-- Blurry / dark road (bad example) -->
  <rect x="60" y="80" width="280" height="180" rx="4" fill="#1a1a1a" opacity="0.9"/>
  <!-- Motion blur lines -->
  <rect x="80" y="100" width="240" height="8" rx="2" fill="#333" opacity="0.5"/>
  <rect x="80" y="130" width="200" height="6" rx="2" fill="#2a2a2a" opacity="0.5"/>
  <rect x="80" y="160" width="220" height="8" rx="2" fill="#333" opacity="0.5"/>
  <rect x="80" y="190" width="180" height="6" rx="2" fill="#2a2a2a" opacity="0.5"/>
  <!-- X mark -->
  <circle cx="200" cy="175" r="35" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="2"/>
  <line x1="183" y1="158" x2="217" y2="192" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="217" y1="158" x2="183" y2="192" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Label -->
  <rect x="80" y="90" width="100" height="22" rx="4" fill="#ef4444"/>
  <text x="130" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">✗ หลีกเลี่ยง</text>
  <!-- Description -->
  <rect x="0" y="265" width="400" height="35" fill="#1a0d0d"/>
  <text x="200" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f87171">ภาพมืด เบลอ หรือไม่ชัดเจน — AI วิเคราะห์ไม่ได้</text>
</svg>
