<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- Road background -->
  <rect x="60" y="80" width="280" height="180" rx="4" fill="#2d2d2d"/>
  <!-- Road markings -->
  <rect x="190" y="100" width="20" height="40" rx="2" fill="#f0c040" opacity="0.7"/>
  <rect x="190" y="155" width="20" height="40" rx="2" fill="#f0c040" opacity="0.7"/>
  <rect x="190" y="210" width="20" height="30" rx="2" fill="#f0c040" opacity="0.7"/>
  <!-- Pothole -->
  <ellipse cx="140" cy="200" rx="45" ry="30" fill="#111" stroke="#555" stroke-width="2"/>
  <ellipse cx="140" cy="200" rx="35" ry="22" fill="#0a0a0a"/>
  <!-- Pothole cracks -->
  <line x1="105" y1="185" x2="95" y2="175" stroke="#444" stroke-width="1.5"/>
  <line x1="175" y1="185" x2="190" y2="178" stroke="#444" stroke-width="1.5"/>
  <line x1="140" y1="170" x2="145" y2="155" stroke="#444" stroke-width="1.5"/>
  <!-- Camera frame hint -->
  <rect x="60" y="80" width="280" height="180" rx="4" fill="none" stroke="#f0c040" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <!-- Corner markers -->
  <polyline points="65,85 65,100 80,100" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="335,85 335,100 320,100" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="65,255 65,240 80,240" fill="none" stroke="#f0c040" stroke-width="3"/>
  <polyline points="335,255 335,240 320,240" fill="none" stroke="#f0c040" stroke-width="3"/>
  <!-- Label -->
  <rect x="80" y="90" width="100" height="22" rx="4" fill="#f0c040"/>
  <text x="130" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e">✓ ตัวอย่างที่ดี</text>
  <!-- Description -->
  <rect x="0" y="265" width="400" height="35" fill="#0d0d1a"/>
  <text x="200" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#aaa">ถ่ายให้เห็นพื้นถนนและความเสียหายชัดเจน</text>
</svg>
