services:
  db:
    image: postgres:15-alpine
    container_name: road_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: road_backend
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CLOUD_ENDPOINT: ${CLOUD_ENDPOINT}
      CLOUD_ACCESS_KEY: ${CLOUD_ACCESS_KEY}
      CLOUD_SECRET_KEY: ${CLOUD_SECRET_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      UPLOAD_DIR: /app/uploads
      # init_gee() (app/ai/gee_integration.py) raises and crashes the app at
      # startup if any of these 3 are missing -- NOT a graceful degrade, despite
      # docs/DEVOPS_GUIDE.md previously (incorrectly) saying otherwise. See
      # production_migration_log.md's "GEE init is a hard startup requirement" entry.
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT}
      GEE_KEY_PATH: ${GEE_KEY_PATH}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
    volumes:
      # Only the runtime-generated uploads directory is a real volume -- models,
      # GIS caches, and the GEE credential file are baked into the image at build
      # time (see backend/Dockerfile / backend/.dockerignore) rather than
      # bind-mounted from the host. Decision confirmed (not reverted-then-redecided):
      # ~165MB of assets costs ~0.6s at the COPY . . layer, not the multi-minute
      # cost that motivated the earlier bind-mount proposal -- see
      # docs/production_migration_log.md's "bake-into-image confirmed" entry.
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: road_frontend
    restart: always
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build: ./nginx
    container_name: road_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
