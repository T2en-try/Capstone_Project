services:
  db:
    image: postgres:15-alpine
    container_name: road_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: road_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALLOWED_ORIGINS: "http://localhost,http://localhost:5173"
      CLOUD_ENDPOINT: ${CLOUD_ENDPOINT}
      CLOUD_ACCESS_KEY: ${CLOUD_ACCESS_KEY}
      CLOUD_SECRET_KEY: ${CLOUD_SECRET_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: road_frontend
    restart: always
    ports:               
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: road_nginx
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: